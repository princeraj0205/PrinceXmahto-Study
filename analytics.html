<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics — PrinceXmahto Study</title>
<link rel="icon" href="assets/princexmahto-logo.svg">
<style>
:root{--bg:#06101d;--panel:#0c1a2b;--line:#20344d;--text:#f7fbff;--muted:#9eb0c5;--gold:#d4af37}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#102943 0,#06101d 42%);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:26px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.brand img{width:44px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:800}.muted{color:var(--muted)}button,input,select{border:1px solid var(--line);background:#091625;color:var(--text);border-radius:10px;padding:10px 12px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.panel{background:rgba(12,26,43,.92);border:1px solid var(--line);border-radius:18px;padding:18px}.stat b{display:block;font-size:28px;margin-top:7px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.panel{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#b9c8da;font-size:12px;position:sticky;top:0;background:#0c1a2b}code{color:#dce8f6}.status{margin:14px 0}.danger{color:#ff9b9b}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:18px 12px}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand"><img src="assets/princexmahto-logo.svg"><div><div class="eyebrow">PRINCEXMAHTO STUDY</div><h1 style="margin:6px 0">Visitor Analytics</h1></div></div><div><button id="refresh">↻ Refresh</button> <button id="logout">Sign out</button></div></header>
<p id="status" class="muted status">Checking admin access…</p>
<section id="app" hidden>
<div class="grid"><div class="stat"><span class="muted">Events</span><b id="events">—</b></div><div class="stat"><span class="muted">Sessions</span><b id="sessions">—</b></div><div class="stat"><span class="muted">Unique IPs</span><b id="ips">—</b></div><div class="stat"><span class="muted">Active today</span><b id="today">—</b></div></div>
<div class="filters"><select id="range"><option value="1">Today</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="90">90 days</option></select><input id="search" placeholder="Search IP, page, session, user, action…"><select id="type"><option value="">All events</option><option>page_view</option><option>click</option><option>page_exit</option></select></div>
<section class="panel"><table><thead><tr><th>Time</th><th>Event</th><th>IP</th><th>Page</th><th>Target</th><th>Session / User</th><th>Device</th></tr></thead><tbody id="rows"></tbody></table></section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const S=window.supabase.createClient('https://dvoioacvqrujywwqqygo.supabase.co','sb_publishable_XJ-KHZyM2H9-ADJudvRKlw_9Mr17W1J');
const $=id=>document.getElementById(id);let all=[];
function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const q=$('search').value.toLowerCase().trim(),t=$('type').value;const rows=all.filter(x=>(!t||x.event_type===t)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).slice(0,500);$('rows').innerHTML=rows.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString())+'</td><td><b>'+esc(x.event_type)+'</b></td><td><code>'+esc(x.ip_address||'—')+'</code></td><td>'+esc(x.page_path||'—')+'</td><td>'+esc(x.target||'—')+'</td><td><code>'+esc(x.session_id)+'</code><br><small>'+esc(x.user_id||'anonymous')+'</small></td><td style="max-width:260px">'+esc(x.user_agent||'—')+'</td></tr>').join('')||'<tr><td colspan="7">No events found.</td></tr>'}
async function load(){const days=Number($('range').value),since=new Date(Date.now()-days*864e5).toISOString();$('status').textContent='Loading…';const {data,error}=await S.from('visitor_events').select('*').gte('created_at',since).order('created_at',{ascending:false}).limit(2000);if(error){$('status').innerHTML='<span class="danger">Access error: '+esc(error.message)+'</span>';return}all=data||[];$('events').textContent=all.length.toLocaleString();$('sessions').textContent=new Set(all.map(x=>x.session_id)).size.toLocaleString();$('ips').textContent=new Set(all.map(x=>x.ip_address).filter(Boolean)).size.toLocaleString();const today=new Date();today.setHours(0,0,0,0);$('today').textContent=all.filter(x=>new Date(x.created_at)>=today).length.toLocaleString();$('status').textContent='Admin analytics · '+all.length+' events loaded';render()}
async function init(){const {data}=await S.auth.getUser();if(!data.user){location.href='auth.html';return}const {data:p,error}=await S.from('profiles').select('role').eq('id',data.user.id).single();if(error||p?.role!=='admin'){$('status').innerHTML='<span class="danger">Admin access required.</span>';return}$('app').hidden=false;load()}
$('refresh').onclick=load;$('range').onchange=load;$('type').onchange=render;$('search').oninput=render;$('logout').onclick=async()=>{await S.auth.signOut();location.href='auth.html'};init();
</script></body></html>
