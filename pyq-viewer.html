<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>PYQ Viewer — PrinceXmahto Study</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="academic-polish.css">
<style>
.viewer{max-width:1400px;margin:0 auto;padding:28px 16px 50px}.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.viewer-head h1{margin:0;font-size:clamp(24px,4vw,42px)}.viewer-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:11px;border:1px solid #dbe3ec;text-decoration:none;color:#0f172a;background:#fff}.btn.primary{background:#07111f;color:#fff;border-color:#07111f}.frame-wrap{position:relative;height:min(78vh,820px);min-height:520px;border-radius:18px;overflow:hidden;border:1px solid #dbe3ec;background:#f8fafc;box-shadow:0 16px 45px rgba(15,23,42,.08)}iframe,object{width:100%;height:100%;border:0}.wm{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,7vw,86px);font-weight:900;letter-spacing:5px;color:rgba(15,23,42,.075);transform:rotate(-28deg);user-select:none;text-shadow:0 1px 0 rgba(255,255,255,.35)}.hint{margin-top:12px;color:#64748b;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="./"><img src="assets/princexmahto-logo.svg" alt="PrinceXmahto"><span>PrinceXmahto <b>Study</b></span></a><div class="top-links"><a class="nav-btn main-btn" href="pyq-1st-year.html">← PYQ 1st Year</a></div></header>
<main class="viewer">
<div class="viewer-head"><div><div class="eyebrow">PRINCEXMAHTO STUDY · WATERMARK VIEW</div><h1 id="title">PYQ Collection</h1></div><div class="viewer-actions"><a id="open" class="btn primary" target="_blank" rel="noopener">Open Source ↗</a><a class="btn" href="pyq-1st-year.html">All 1st Year PYQs</a></div></div>
<div class="frame-wrap"><object id="pdf" data="" type="application/pdf" aria-label="PYQ PDF"><iframe id="frame" title="PYQ collection"></iframe></object><div class="wm">PrinceXmahto</div></div>
<div class="hint">Light PrinceXmahto branding is overlaid on this viewer. The original source document is not modified.</div>
</main>
<script>
const p=new URLSearchParams(location.search), src=p.get('src'), title=p.get('title')||'PYQ Collection';
document.getElementById('title').textContent=title;
if(src){const u=decodeURIComponent(src);document.getElementById('pdf').data=u;document.getElementById('frame').src=u;document.getElementById('open').href=u}else{document.getElementById('pdf').data='https://sbte.bihar.gov.in/previous-year-questions';document.getElementById('frame').src='https://sbte.bihar.gov.in/previous-year-questions';document.getElementById('open').href='https://sbte.bihar.gov.in/previous-year-questions'}
</script>
</body></html>
