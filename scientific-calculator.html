nsert('^2')">x²</button><button class="fn" onclick="insert('^')">xʸ</button><button class="fn" onclick="insert('pi')">π</button><button class="op" onclick="insert('*')">×</button><button onclick="insert('7')">7</button><button onclick="insert('8')">8</button><button onclick="insert('9')">9</button><button class="fn" onclick="insert('exp(')">eˣ</button><button class="op" onclick="insert('-')">−</button><button onclick="insert('4')">4</button><button onclick="insert('5')">5</button><button onclick="insert('6')">6</button><button class="fn" onclick="insert('!')">n!</button><button class="op" onclick="insert('+')">+</button><button onclick="insert('1')">1</button><button onclick="insert('2')">2</button><button onclick="insert('3')">3</button><button class="fn" onclick="insert('%')">%</button><button class="eq" onclick="calculate()">=</button><button class="wide" onclick="insert('0')">0</button><button onclick="insert('.')">.</button><button class="fn" onclick="insert('ans')">Ans</button></div></section></main><script>let input='',ans=0,mode='DEG';const exprEl=document.getElementById('expr'),resEl=document.getElementById('result'),statusEl=document.getElementById('status');function insert(v){input+=v;render()}function clearAll(){input='';resEl.textContent='0';exprEl.textContent=''}function backspace(){input=input.slice(0,-1);render()}function setMode(m){mode=m;document.getElementById('deg').classList.toggle('active',m==='DEG');document.getElementById('rad').classList.toggle('active',m==='RAD');statusEl.textContent=m+'  SCI'}function render(){exprEl.textContent=input||'';resEl.textContent=input||'0'}function factorial(n){if(n<0||n>170||Math.floor(n)!==n)throw Error('Invalid factorial');let r=1;for(let i=2;i<=n;i++)r*=i;return r}function calculate(){try{let s=input.replaceAll('pi','PI').replaceAll('ans','ANS').replace(/(\d+(?:\.\d+)?)!/g,'fact($1)').replaceAll('^','**').replaceAll('%','/100');s=s.replace(/sqrt\(/g,'Math.sqrt(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/exp\(/g,'Math.exp(');if(mode==='DEG'){s=s.replace(/sin\(/g,'Math.sin(Math.PI/180*').replace(/cos\(/g,'Math.cos(Math.PI/180*').replace(/tan\(/g,'Math.tan(Math.PI/180*')}else{s=s.replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(')}s=s.replace(/PI/g,'Math.PI').replace(/ANS/g,'ans').replace(/fact\(/g,'factorial(');let value=Function('Math','factorial','ans','return '+s)(Math,factorial,ans);if(!Number.isFinite(value))throw Error('Math error');ans=value;exprEl.textContent=input+' =';resEl.textContent=format(value);input=String(value)}catch(e){resEl.textContent='Error';exprEl.textContent=e.message||'Invalid expression'}}function format(n){return Number.isInteger(n)?String(n):Number(n.toPrecision(12)).toString()}document.addEventListener('keydown',e=>{if(/[0-9.()+\-*/^]/.test(e.key))insert(e.key);else if(e.key==='Enter')calculate();else if(e.key==='Backspace')backspace();else if(e.key==='Escape')clearAll()});</script></body></html>
