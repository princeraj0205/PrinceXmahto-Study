<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071525"><title>PrinceXmahto Scientific Calculator</title>
<link rel="icon" href="assets/princexmahto-logo.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="academic-polish.css">
<style>
.calc-wrap{max-width:1050px;margin:0 auto;padding:42px 20px 70px}.calc-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}.calc-head img{width:48px;height:48px}.calc-head h1{margin:0;font-size:clamp(28px,5vw,46px)}.calc-head p{margin:5px 0 0;color:#6b7788}.calc{max-width:620px;margin:auto;background:#071525;border:1px solid #1e334d;border-radius:22px;padding:18px;box-shadow:0 25px 70px rgba(7,21,37,.22)}.display{background:#020912;border:1px solid #20364e;border-radius:14px;padding:14px 16px;text-align:right;min-height:92px;margin-bottom:14px;overflow:hidden}.expr{color:#8ea2b9;font-size:14px;min-height:22px;white-space:nowrap;overflow:auto}.result{color:#fff;font-size:34px;font-weight:800;white-space:nowrap;overflow:auto;border:0;border-radius:0;box-shadow:none}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.keys button{min-height:55px;border:1px solid #29425e;border-radius:11px;background:#10243a;color:#eef5fc;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}.keys button:hover{transform:translateY(-1px);background:#17324f}.keys button:active{transform:scale(.97)}.keys .fn{background:#122d46;color:#7fc8ff}.keys .op{background:#173b5e;color:#8ed0ff}.keys .eq{background:#155eef;color:white}.keys .danger{background:#48202a;color:#ff9cae}.keys .wide{grid-column:span 2}.mode{display:flex;gap:8px;margin-bottom:12px}.mode button{border:1px solid #29425e;background:#0d2033;color:#9fb2c8;border-radius:9px;padding:7px 12px;font-weight:700}.mode button.active{background:#155eef;color:#fff}.back{display:inline-block;margin-bottom:25px;text-decoration:none;color:#155eef;font-weight:800}@media(max-width:560px){.calc-wrap{padding:25px 10px 50px}.calc{padding:11px;border-radius:17px}.keys{gap:6px}.keys button{min-height:50px;font-size:14px}.result{font-size:28px}}
</style></head>
<body>
<header class="topbar"><a class="brand" href="./"><img src="assets/princexmahto-logo.svg" alt="PrinceXmahto"><span>PrinceXmahto <b>Study</b></span></a><nav><a href="./#catalog">Catalogue</a><a href="./#how">How it works</a><a href="./#about">About</a></nav><div class="top-links"><a class="nav-btn main-btn" href="https://prince-xmahto.vercel.app/" target="_blank" rel="noopener">🌐 Main Website</a><a class="nav-btn help-btn" href="https://t.me/princexmahto" target="_blank" rel="noopener">💬 Help · Telegram</a></div></header>
<main class="calc-wrap"><a class="back" href="./">← Back to Study Portal</a><div class="calc-head"><img src="assets/princexmahto-logo.svg" alt="PrinceXmahto logo"><div><h1>Scientific Calculator</h1><p>PrinceXmahto Study · Fully browser-based</p></div></div>
<section class="calc" aria-label="Scientific calculator"><div class="display"><div id="expr" class="expr"></div><div id="result" class="result">0</div></div><div class="mode"><button id="deg" class="active" onclick="setMode('DEG')">DEG</button><button id="rad" onclick="setMode('RAD')">RAD</button></div><div class="keys">
<button class="danger" onclick="clearAll()">AC</button><button onclick="backspace()">⌫</button><button class="fn" onclick="insert('(')">(</button><button class="fn" onclick="insert(')')">)</button><button class="op" onclick="insert('/')">÷</button>
<button class="fn" onclick="insert('sin(')">sin</button><button class="fn" onclick="insert('cos(')">cos</button><button class="fn" onclick="insert('tan(')">tan</button><button class="fn" onclick="insert('log(')">log</button><button class="fn" onclick="insert('ln(')">ln</button>
<button class="fn" onclick="insert('sqrt(')">√</button><button class="fn" onclick="insert('^2')">x²</button><button class="fn" onclick="insert('^')">xʸ</button><button class="fn" onclick="insert('pi')">π</button><button class="op" onclick="insert('*')">×</button>
<button onclick="insert('7')">7</button><button onclick="insert('8')">8</button><button onclick="insert('9')">9</button><button class="fn" onclick="insert('exp(')">eˣ</button><button class="op" onclick="insert('-')">−</button>
<button onclick="insert('4')">4</button><button onclick="insert('5')">5</button><button onclick="insert('6')">6</button><button class="fn" onclick="insert('!')">n!</button><button class="op" onclick="insert('+')">+</button>
<button onclick="insert('1')">1</button><button onclick="insert('2')">2</button><button onclick="insert('3')">3</button><button class="fn" onclick="insert('%')">%</button><button class="eq" onclick="calculate()">=</button>
<button class="wide" onclick="insert('0')">0</button><button onclick="insert('.')">.</button><button class="fn" onclick="insert('ans')">Ans</button>
</div></section></main>
<script>
let input='',ans=0,mode='DEG';const exprEl=document.getElementById('expr'),resEl=document.getElementById('result');
function insert(v){input+=v;render()};function clearAll(){input='';resEl.textContent='0';exprEl.textContent=''};function backspace(){input=input.slice(0,-1);render()};function setMode(m){mode=m;document.getElementById('deg').classList.toggle('active',m==='DEG');document.getElementById('rad').classList.toggle('active',m==='RAD')}
function render(){exprEl.textContent=input||'';resEl.textContent=input||'0'}
function factorial(n){if(n<0||n>170||Math.floor(n)!==n)throw Error('Invalid factorial');let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function calculate(){try{let s=input.replaceAll('pi','PI').replaceAll('ans','ANS').replace(/(\d+(?:\.\d+)?)!/g,'fact($1)').replaceAll('^','**').replaceAll('%','/100');s=s.replace(/sqrt\(/g,'Math.sqrt(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/exp\(/g,'Math.exp(');let d=mode==='DEG'?'Math.PI/180':'1';s=s.replace(/sin\(/g,`Math.sin(`).replace(/cos\(/g,`Math.cos(`).replace(/tan\(/g,`Math.tan(`);s=s.replace(/PI/g,'Math.PI').replace(/ANS/g,'ans').replace(/fact\(/g,'factorial(');let value=Function('Math','factorial','ans','return '+s)(Math,factorial,ans);if(!Number.isFinite(value))throw Error('Math error');ans=value;exprEl.textContent=input+' =';resEl.textContent=format(value);input=String(value)}catch(e){resEl.textContent='Error';exprEl.textContent=e.message||'Invalid expression'}}
function format(n){return Number.isInteger(n)?String(n):Number(n.toPrecision(12)).toString()}
document.addEventListener('keydown',e=>{if(/[0-9.()+\-*/^]/.test(e.key))insert(e.key);else if(e.key==='Enter')calculate();else if(e.key==='Backspace')backspace();else if(e.key==='Escape')clearAll()});
</script></body></html>
