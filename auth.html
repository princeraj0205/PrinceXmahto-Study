<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — PrinceXmahto Study</title><link rel="icon" href="assets/princexmahto-logo.svg"><style>body{margin:0;font-family:DM Sans,Arial;background:#07111f;color:#fff;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));background:#101c2d;border:1px solid #26364d;border-radius:24px;padding:30px;box-sizing:border-box;box-shadow:0 20px 70px #0008}img{width:56px}h1{margin:18px 0 8px;font-size:30px}p{color:#aebbd0;line-height:1.6}input{width:100%;box-sizing:border-box;padding:13px 14px;margin:7px 0;border-radius:12px;border:1px solid #30435d;background:#0a1422;color:#fff;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:12px;background:#fff;color:#07111f;font-weight:800;margin-top:12px;cursor:pointer}.muted{font-size:12px}.ok{color:#8ff0b1}.err{color:#ff9c9c}</style></head><body><main class="card"><img src="assets/princexmahto-logo.svg" alt="PrinceXmahto"><h1>PrinceXmahto Study</h1><p>Sign in or create your account to access protected course content.</p><input id="name" placeholder="Full name (for signup)"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><label class="muted"><input id="consent" type="checkbox" style="width:auto"> I agree that PrinceXmahto Study may record course access, progress and learning activity for access control, security and learning analytics.</label><button id="signup">Create account</button><button id="login">Sign in</button><p id="msg"></p><p class="muted"><a href="./" style="color:#fff">← Back to Study</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S=window.supabase.createClient('https://dvoioacvqrujywwqqygo.supabase.co','sb_publishable_XJ-KHZyM2H9-ADJudvRKlw_9Mr17W1J');const $=id=>document.getElementById(id);function msg(t,c=''){ $('msg').textContent=t;$('msg').className=c }async function signup(){if(!$('consent').checked)return msg('Please accept the activity notice.','err');const {data,error}=await S.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:$('name').value.trim(),tracking_consent:true}}});if(error)return msg(error.message,'err');if(data.user){await S.from('profiles').upsert({id:data.user.id,full_name:$('name').value.trim(),tracking_consent:true});await S.from('enrollments').upsert({user_id:data.user.id,course_id:139},{onConflict:'user_id,course_id'});msg('Account created. Check your email if confirmation is enabled.','ok')}}async function login(){const {data,error}=await S.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,'err');if(data.user)await S.from('enrollments').upsert({user_id:data.user.id,course_id:139},{onConflict:'user_id,course_id'});location.href='watch.html?course=139'}$('signup').onclick=signup;$('login').onclick=login;</script></body></html>
