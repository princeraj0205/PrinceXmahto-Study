<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Player — PrinceXmahto Study</title><link rel="icon" href="assets/princexmahto-logo.svg"><style>body{margin:0;font-family:DM Sans,Arial;background:#07111f;color:#fff}.bar{padding:16px 22px;border-bottom:1px solid #26364d;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.brand img{width:34px}.wrap{max-width:1050px;margin:auto;padding:30px 18px}.panel{background:#101c2d;border:1px solid #26364d;border-radius:20px;padding:22px;margin-bottom:18px}.muted{color:#aebbd0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.danger{background:#ffdfdf}.success{color:#8ff0b1}.video{aspect-ratio:16/9;background:#03070d;border-radius:16px;display:grid;place-items:center;color:#7890ad;text-align:center}.notice{font-size:13px;color:#aebbd0;line-height:1.6}</style></head><body><header class="bar"><div class="brand"><img src="assets/princexmahto-logo.svg"> PrinceXmahto Study</div><button class="btn danger" id="logout">Sign out</button></header><main class="wrap"><section class="panel"><h1 id="title">Loading course…</h1><p class="muted" id="user"></p><div class="video"><div><strong>Authorized Course Player</strong><p>Lesson content will appear here after the authorized content source is configured.</p></div></div><p class="notice">Your course access and progress may be recorded according to the activity notice accepted during signup.</p></section><section class="panel"><h2>Activity</h2><p id="status" class="muted">Checking access…</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S=window.supabase.createClient('https://dvoioacvqrujywwqqygo.supabase.co','sb_publishable_XJ-KHZyM2H9-ADJudvRKlw_9Mr17W1J');let uid=null,started=null,courseId=null;async function init(){const {data:{user}}=await S.auth.getUser();if(!user){location.href='auth.html';return}uid=user.id;courseId=new URLSearchParams(location.search).get('course')||'139';$('user').textContent=user.email;const {data:c,error}=await S.from('courses').select('*').eq('id',courseId).eq('is_active',true).single();if(error||!c){$('status').textContent='Course unavailable.';return}$('title').textContent=c.title;started=new Date();await S.from('learning_activity').insert({user_id:uid,course_id:c.id,event_type:'course_open',started_at:started.toISOString(),metadata:{source:'PrinceXmahto Study'}});$('status').innerHTML='<span class="success">Access granted. Course session is being recorded for analytics.</span>'}async function end(){if(!uid||!started)return;const duration=Math.max(0,Math.round((Date.now()-started.getTime())/1000));await S.from('learning_activity').insert({user_id:uid,course_id:Number(courseId),event_type:'course_close',started_at:started.toISOString(),ended_at:new Date().toISOString(),duration_seconds:duration,metadata:{source:'PrinceXmahto Study'}})}$('logout').onclick=async()=>{await end();await S.auth.signOut();location.href='auth.html'};window.addEventListener('beforeunload',end);init();</script></body></html>
